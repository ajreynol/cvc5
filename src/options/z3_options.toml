id     = "Z3"
name   = "Z3 Core"

[[option]]
  name       = "z3"
  category   = "expert"
  long       = "z3"
  type       = "bool"
  default    = "false"
  help       = "use the ported Z3 SMT core instead of cvc5's own CDCL(T) engine"

# ---------------------------------------------------------------- core search

[[option]]
  name       = "z3AutoConfig"
  category   = "expert"
  long       = "z3-auto-config"
  type       = "bool"
  default    = "true"
  help       = "configure the ported Z3 core per logic, as Z3's auto_config does"

[[option]]
  name       = "z3Relevancy"
  category   = "expert"
  long       = "z3-relevancy=N"
  type       = "uint64_t"
  default    = "2"
  maximum    = "2"
  help       = "relevancy propagation level of the ported Z3 core (0 disables it)"

[[option]]
  name       = "z3CaseSplit"
  category   = "expert"
  long       = "z3-case-split=MODE"
  type       = "Z3CaseSplitMode"
  default    = "ACTIVITY_DELAY_NEW"
  help       = "case split strategy of the ported Z3 core"
  help_mode  = "Case split strategies of the ported Z3 core."
[[option.mode.ACTIVITY]]
  name = "activity"
  help = "Split on the most active variable."
[[option.mode.ACTIVITY_DELAY_NEW]]
  name = "activity-delay-new"
  help = "Split on activity, but delay splits created during the search."
[[option.mode.ACTIVITY_WITH_CACHE]]
  name = "activity-with-cache"
  help = "Split on activity, caching the activity."
[[option.mode.RELEVANCY]]
  name = "relevancy"
  help = "Split on relevancy."
[[option.mode.RELEVANCY_ACTIVITY]]
  name = "relevancy-activity"
  help = "Split on relevancy, breaking ties by activity."
[[option.mode.RELEVANCY_GOAL]]
  name = "relevancy-goal"
  help = "Split on relevancy and the current goal."
[[option.mode.ACTIVITY_THEORY_AWARE_BRANCHING]]
  name = "activity-theory-aware-branching"
  help = "Split on activity, letting theory solvers manipulate the activity."

[[option]]
  name       = "z3PhaseSelection"
  category   = "expert"
  long       = "z3-phase-selection=MODE"
  type       = "Z3PhaseSelectionMode"
  default    = "CACHING_CONSERVATIVE"
  help       = "phase selection strategy of the ported Z3 core"
  help_mode  = "Phase selection strategies of the ported Z3 core."
[[option.mode.ALWAYS_FALSE]]
  name = "always-false"
  help = "Always try the negative phase first."
[[option.mode.ALWAYS_TRUE]]
  name = "always-true"
  help = "Always try the positive phase first."
[[option.mode.CACHING]]
  name = "caching"
  help = "Reuse the last phase the variable was assigned."
[[option.mode.CACHING_CONSERVATIVE]]
  name = "caching-conservative"
  help = "Reuse the cached phase, turning caching on and off periodically."
[[option.mode.CACHING_CONSERVATIVE2]]
  name = "caching-conservative2"
  help = "Like caching-conservative, alternating the default phase over time."
[[option.mode.RANDOM]]
  name = "random"
  help = "Choose the phase at random."
[[option.mode.OCCURRENCE]]
  name = "occurrence"
  help = "Choose the phase that occurs in more clauses."
[[option.mode.THEORY]]
  name = "theory"
  help = "Let theory solvers choose the phase."

[[option]]
  name       = "z3RandomInitialActivity"
  category   = "expert"
  long       = "z3-random-initial-activity=MODE"
  type       = "Z3InitialActivityMode"
  default    = "RANDOM_WHEN_SEARCHING"
  help       = "how the initial activity of a Boolean variable is chosen in the ported Z3 core"
  help_mode  = "How the initial activity of a Boolean variable is chosen."
[[option.mode.ZERO]]
  name = "zero"
[[option.mode.RANDOM]]
  name = "random"
[[option.mode.RANDOM_WHEN_SEARCHING]]
  name = "random-when-searching"

[[option]]
  name       = "z3RestartStrategy"
  category   = "expert"
  long       = "z3-restart-strategy=MODE"
  type       = "Z3RestartStrategyMode"
  default    = "IN_OUT_GEOMETRIC"
  help       = "restart strategy of the ported Z3 core"
  help_mode  = "Restart strategies of the ported Z3 core."
[[option.mode.GEOMETRIC]]
  name = "geometric"
  help = "Geometrically increasing restart threshold."
[[option.mode.IN_OUT_GEOMETRIC]]
  name = "in-out-geometric"
  help = "Inner/outer geometrically increasing restart threshold."
[[option.mode.LUBY]]
  name = "luby"
  help = "Luby sequence of restart thresholds."
[[option.mode.FIXED]]
  name = "fixed"
  help = "Fixed restart threshold."
[[option.mode.ARITHMETIC]]
  name = "arithmetic"
  help = "Arithmetically increasing restart threshold."

[[option]]
  name       = "z3RestartInitial"
  category   = "expert"
  long       = "z3-restart-initial=N"
  type       = "uint64_t"
  default    = "100"
  help       = "initial restart threshold of the ported Z3 core"

[[option]]
  name       = "z3RestartFactor"
  category   = "expert"
  long       = "z3-restart-factor=F"
  type       = "double"
  default    = "1.1"
  minimum    = "1.0"
  help       = "restart threshold growth factor of the ported Z3 core"

[[option]]
  name       = "z3DelayUnits"
  category   = "expert"
  long       = "z3-delay-units"
  type       = "bool"
  default    = "false"
  help       = "delay the propagation of unit clauses in the ported Z3 core"

[[option]]
  name       = "z3RandomSeed"
  category   = "expert"
  long       = "z3-random-seed=N"
  type       = "uint64_t"
  default    = "0"
  help       = "random seed of the ported Z3 core"

# --------------------------------------------------- quantifier instantiation

[[option]]
  name       = "z3Ematching"
  category   = "expert"
  long       = "z3-ematching"
  type       = "bool"
  default    = "true"
  help       = "use E-matching for quantifier instantiation in the ported Z3 core"

[[option]]
  name       = "z3QiLazyQuickChecker"
  category   = "expert"
  long       = "z3-qi-lazy-quick-checker"
  type       = "bool"
  default    = "true"
  help       = "do not run the incomplete model checker at final check"

[[option]]
  name       = "z3QiQuickCheckerConservative"
  category   = "expert"
  long       = "z3-qi-quick-checker-conservative"
  type       = "bool"
  default    = "true"
  help       = "restrict the candidate bindings of the model checker as Z3 does"

[[option]]
  name       = "z3EnumInst"
  category   = "expert"
  long       = "z3-enum-inst"
  type       = "bool"
  default    = "false"
  help       = "instantiate enumeratively once E-matching is exhausted, which stands in for Z3's model based instantiation"

[[option]]
  name       = "z3EnumInstFallback"
  category   = "expert"
  long       = "z3-enum-inst-fallback"
  type       = "bool"
  default    = "false"
  help       = "let enumerative instantiation guess a binding when none is falsified"

[[option]]
  name       = "z3EnumInstMaxPerRound"
  category   = "expert"
  long       = "z3-enum-inst-max-per-round=N"
  type       = "uint64_t"
  default    = "8"
  help       = "how many enumerative instances one final check may add"

[[option]]
  name       = "z3DumpInstances"
  category   = "expert"
  long       = "z3-dump-instances=FILE"
  type       = "std::string"
  default    = '""'
  help       = "write every quantifier instance the core creates to FILE, one per line, for comparison with Z3's -tr:qi_queue"

[[option]]
  name       = "z3DumpAssertions"
  category   = "expert"
  long       = "z3-dump-assertions=FILE"
  type       = "std::string"
  default    = '""'
  help       = "write what the core is given, after this port's own preprocessing, to FILE as a benchmark"

[[option]]
  name       = "z3DumpSaturated"
  category   = "expert"
  long       = "z3-dump-saturated=FILE"
  type       = "std::string"
  default    = '""'
  help       = "write the state E-matching saturated in to FILE, as a benchmark"

[[option]]
  name       = "z3CheckSaturated"
  category   = "expert"
  long       = "z3-check-saturated"
  type       = "bool"
  default    = "false"
  help       = "hand the saturated state's ground literals to a full cvc5 subsolver and report what it says"

[[option]]
  name       = "z3RewriteAssertions"
  category   = "expert"
  long       = "z3-rewrite-assertions"
  type       = "bool"
  default    = "true"
  help       = "run cvc5's rewriter over each assertion after NNF and after pattern inference, as Z3's reduce_asserted_formulas does"

[[option]]
  name       = "z3Preset"
  category   = "expert"
  long       = "z3-preset=MODE"
  type       = "Z3PresetMode"
  default    = "DEFAULT"
  help       = "a named Z3 configuration; it sets the --z3-* options the user did not set explicitly"
  help_mode  = "Named configurations of the ported Z3 core."
[[option.mode.DEFAULT]]
  name = "default"
  help = "Z3's own defaults, with auto configuration."
[[option.mode.VERUS]]
  name = "verus"
  help = "The options Verus runs Z3 with: auto_config=false smt.mbqi=false smt.case_split=3 smt.qi.eager_threshold=100 smt.delay_units=true pi.enabled=false."

[[option]]
  name       = "z3PatternInference"
  category   = "expert"
  long       = "z3-pattern-inference"
  type       = "bool"
  default    = "true"
  help       = "infer patterns for quantifiers that have none, as Z3's pi.enabled does"

[[option]]
  name       = "z3Arith"
  category   = "expert"
  long       = "z3-arith=MODE"
  type       = "Z3ArithMode"
  default    = "BRIDGE"
  help       = "how the ported core solves arithmetic"
  help_mode  = "Arithmetic solvers of the ported Z3 core."
[[option.mode.BRIDGE]]
  name = "bridge"
  help = "Hand the assigned arithmetic literals to a cvc5 subsolver at final check."
[[option.mode.NATIVE]]
  name = "native"
  help = "The port of Z3's simplex-based theory_arith (smt.arith.solver=2)."

[[option]]
  name       = "z3ArithNl"
  category   = "expert"
  long       = "z3-arith-nl"
  type       = "bool"
  default    = "true"
  help       = "let the arithmetic bridge reason about nonlinear terms, as Z3's smt.arith.nl does; when off, a nonlinear subproblem the linear relaxation does not refute makes the bridge give up"

[[option]]
  name       = "z3NativeTermFormulas"
  category   = "expert"
  long       = "z3-native-term-formulas"
  type       = "bool"
  default    = "true"
  help       = "leave term if-then-else and Boolean terms in term positions to the ported core, which handles them as Z3 does, instead of purifying them in cvc5's theory preprocessing"

[[option]]
  name       = "z3NgLiftIte"
  category   = "expert"
  long       = "z3-ng-lift-ite=MODE"
  type       = "Z3LiftIteMode"
  default    = "AUTO"
  help       = "lift if-then-else out of non-ground applications, as Z3's ng_lift_ite does"
  help_mode  = "If-then-else lifting modes of the ported Z3 preprocessing."
[[option.mode.AUTO]]
  name = "auto"
  help = "Conservative when --z3-auto-config is on (Z3's setup_AUFLIA sets it for a quantified input), none otherwise."
[[option.mode.NONE]]
  name = "none"
  help = "Do not lift."
[[option.mode.CONSERVATIVE]]
  name = "conservative"
  help = "Lift only out of an application with exactly one non-Boolean if-then-else argument."
[[option.mode.FULL]]
  name = "full"
  help = "Lift out of every application with a non-Boolean if-then-else argument."

[[option]]
  name       = "z3EliminateAnd"
  category   = "expert"
  long       = "z3-eliminate-and"
  type       = "bool"
  default    = "false"
  help       = "rewrite a conjunction as a negated disjunction before the core sees it, as Z3's set_eliminate_and does"

[[option]]
  name       = "z3QiProfile"
  category   = "expert"
  long       = "z3-qi-profile"
  type       = "bool"
  default    = "false"
  help       = "print per-quantifier instantiation counts, as Z3's smt.qi.profile does"

[[option]]
  name       = "z3QiChecker"
  category   = "expert"
  long       = "z3-qi-checker"
  type       = "bool"
  default    = "true"
  help       = "skip an instance whose body the current assignment already satisfies"

[[option]]
  name       = "z3BridgeFixedEqs"
  category   = "expert"
  long       = "z3-bridge-fixed-eqs"
  type       = "bool"
  default    = "false"
  help       = "ask the theory bridge's subsolver which shared terms are pinned to their value and propagate those equalities"

[[option]]
  name       = "z3BridgeRlimitPer"
  category   = "expert"
  long       = "z3-bridge-rlimit-per=N"
  type       = "uint64_t"
  default    = "200000"
  help       = "resource limit of one call to the cvc5 theory bridge subsolver, 0 for none"

[[option]]
  name       = "z3BridgeActivation"
  category   = "expert"
  long       = "z3-bridge-activation"
  type       = "bool"
  default    = "false"
  help       = "give each literal the bridge assumes an activation atom, asserted once, instead of re-sending (and re-preprocessing) the literal on every subsolver call"

[[option]]
  name       = "z3BridgeEager"
  category   = "expert"
  long       = "z3-bridge-eager"
  type       = "bool"
  default    = "false"
  help       = "run the cvc5 theory bridge during propagation, not only at final check"

[[option]]
  name       = "z3ForceRematch"
  category   = "expert"
  long       = "z3-force-rematch"
  type       = "bool"
  default    = "false"
  help       = "diagnostic: rematch every code tree over every enode at final check"

[[option]]
  name       = "z3Mbqi"
  category   = "expert"
  long       = "z3-mbqi"
  type       = "bool"
  default    = "true"
  help       = "use model based quantifier instantiation in the ported Z3 core"

[[option]]
  name       = "z3QiCost"
  category   = "expert"
  long       = "z3-qi-cost=STR"
  type       = "std::string"
  default    = '"(+ weight generation)"'
  help       = "the cost function used to delay quantifier instantiations"

[[option]]
  name       = "z3QiNewGen"
  category   = "expert"
  long       = "z3-qi-new-gen=STR"
  type       = "std::string"
  default    = '"cost"'
  help       = "how the generation of terms created by an instantiation is set"

[[option]]
  name       = "z3QiEagerThreshold"
  category   = "expert"
  long       = "z3-qi-eager-threshold=F"
  type       = "double"
  default    = "10.0"
  minimum    = "0.0"
  help       = "instantiations whose cost exceeds this are delayed"

[[option]]
  name       = "z3QiLazyThreshold"
  category   = "expert"
  long       = "z3-qi-lazy-threshold=F"
  type       = "double"
  default    = "20.0"
  minimum    = "0.0"
  help       = "instantiations whose cost exceeds this are dropped"

[[option]]
  name       = "z3QiMaxMultiPatterns"
  category   = "expert"
  long       = "z3-qi-max-eager-multipatterns=N"
  type       = "uint64_t"
  default    = "0"
  help       = "maximum number of multi-patterns matched eagerly"

[[option]]
  name       = "z3QiMaxInstances"
  category   = "expert"
  long       = "z3-qi-max-instances=N"
  type       = "uint64_t"
  default    = "4294967295"
  help       = "maximum number of quantifier instantiations"
