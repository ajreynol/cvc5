id     = "Z3"
name   = "Z3 Core"

[[option]]
  name       = "z3"
  category   = "expert"
  long       = "z3"
  type       = "bool"
  default    = "false"
  help       = "use the ported Z3 quantifier core (E-matching, relevancy, instance scheduling) in place of cvc5's quantifiers engine; cvc5's theories do the ground reasoning"

[[option]]
  name       = "z3HostDelayUnits"
  category   = "expert"
  long       = "z3-host-delay-units"
  type       = "bool"
  default    = "true"
  help       = "with --z3, weaken a lemma that is a unit at the base level of the SAT solver with the negation of the first decision, so that the SAT solver assigns its literal at the first decision level rather than restarting (as Z3's delay_units)"

# ---------------------------------------------------------------- core search

[[option]]
  name       = "z3HostLocalInstances"
  category   = "expert"
  long       = "z3-host-local-instances"
  type       = "bool"
  default    = "true"
  help       = "with --z3, send quantifier instances as lemmas local to the SAT context (as cvc5's --inst-local), so that cvc5's decision heuristic considers an instance only where it was last made"

[[option]]
  name       = "z3Relevancy"
  category   = "expert"
  long       = "z3-relevancy=N"
  type       = "uint64_t"
  default    = "2"
  maximum    = "2"
  help       = "relevancy propagation level of the ported Z3 core (0 disables it)"

[[option]]
  name       = "z3PatternInference"
  category   = "expert"
  long       = "z3-pattern-inference"
  type       = "bool"
  default    = "true"
  help       = "infer patterns for quantifiers that have none, as Z3's pi.enabled does"

[[option]]
  name       = "z3QiCost"
  category   = "expert"
  long       = "z3-qi-cost=STR"
  type       = "std::string"
  default    = '"(+ weight generation)"'
  help       = "the cost function used to delay quantifier instantiations"

[[option]]
  name       = "z3QiNewGen"
  category   = "expert"
  long       = "z3-qi-new-gen=STR"
  type       = "std::string"
  default    = '"cost"'
  help       = "how the generation of terms created by an instantiation is set"

[[option]]
  name       = "z3QiEagerThreshold"
  category   = "expert"
  long       = "z3-qi-eager-threshold=F"
  type       = "double"
  default    = "100.0"
  minimum    = "0.0"
  help       = "instantiations whose cost exceeds this are delayed"

[[option]]
  name       = "z3QiLazyThreshold"
  category   = "expert"
  long       = "z3-qi-lazy-threshold=F"
  type       = "double"
  default    = "20.0"
  minimum    = "0.0"
  help       = "instantiations whose cost exceeds this are dropped"

[[option]]
  name       = "z3QiMaxMultiPatterns"
  category   = "expert"
  long       = "z3-qi-max-eager-multipatterns=N"
  type       = "uint64_t"
  default    = "0"
  help       = "maximum number of multi-patterns matched eagerly"

[[option]]
  name       = "z3QiMaxInstances"
  category   = "expert"
  long       = "z3-qi-max-instances=N"
  type       = "uint64_t"
  default    = "4294967295"
  help       = "maximum number of quantifier instantiations"

[[option]]
  name       = "z3QiChecker"
  category   = "expert"
  long       = "z3-qi-checker"
  type       = "bool"
  default    = "true"
  help       = "skip an instance whose body the current assignment already satisfies"
